<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="WeChat ClawBot connects a phone to the local DSH web UI through a QR login and an SSH tunnel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1117"/>
      <stop offset="1" stop-color="#1c2331"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="300" rx="18" fill="url(#bg)"/>
  <!-- phone with WeChat bubble -->
  <g transform="translate(64 56)">
    <rect x="0" y="0" width="118" height="196" rx="20" fill="#0b0f14" stroke="#3b4658" stroke-width="3"/>
    <rect x="12" y="22" width="94" height="152" rx="8" fill="#111821"/>
    <rect x="34" y="34" width="50" height="26" rx="13" fill="#22c55e" opacity="0.92"/>
    <path d="M46 47 h26" stroke="#062e14" stroke-width="4" stroke-linecap="round"/>
    <rect x="22" y="76" width="64" height="18" rx="9" fill="#1f2937"/>
    <rect x="22" y="104" width="44" height="18" rx="9" fill="#2563eb" opacity="0.85"/>
    <rect x="22" y="136" width="58" height="18" rx="9" fill="#1f2937"/>
    <rect x="44" y="184" width="30" height="4" rx="2" fill="#3b4658"/>
  </g>
  <!-- QR card -->
  <g transform="translate(236 84)">
    <rect x="0" y="0" width="96" height="96" rx="12" fill="#f8fafc"/>
    <g fill="#0f172a">
      <rect x="12" y="12" width="22" height="22" rx="3"/>
      <rect x="62" y="12" width="22" height="22" rx="3"/>
      <rect x="12" y="62" width="22" height="22" rx="3"/>
      <rect x="42" y="42" width="10" height="10"/>
      <rect x="58" y="44" width="8" height="8"/>
      <rect x="44" y="60" width="8" height="16"/>
      <rect x="62" y="62" width="22" height="22" rx="3"/>
      <rect x="42" y="14" width="6" height="6"/>
    </g>
  </g>
  <!-- lock/bridge -->
  <g transform="translate(232 190)">
    <rect x="0" y="18" width="104" height="12" rx="6" fill="url(#accent)" opacity="0.9"/>
    <path d="M20 18 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <rect x="16" y="18" width="32" height="24" rx="5" fill="#334155"/>
    <circle cx="32" cy="29" r="3" fill="#22c55e"/>
  </g>
  <!-- DSH panel -->
  <g transform="translate(380 56)">
    <rect x="0" y="0" width="196" height="196" rx="16" fill="#111827" stroke="#3b4658" stroke-width="3"/>
    <rect x="0" y="0" width="196" height="30" rx="16" fill="#1f2937"/>
    <circle cx="18" cy="15" r="5" fill="#ef4444"/>
    <circle cx="34" cy="15" r="5" fill="#f59e0b"/>
    <circle cx="50" cy="15" r="5" fill="#22c55e"/>
    <rect x="18" y="48" width="160" height="10" rx="5" fill="#334155"/>
    <rect x="18" y="70" width="124" height="10" rx="5" fill="#334155"/>
    <rect x="18" y="104" width="160" height="64" rx="8" fill="#0b1220" stroke="#2b3648" stroke-width="2"/>
    <path d="M34 124 l10 8 l-10 8" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="54" y="122" width="86" height="8" rx="4" fill="#22c55e" opacity="0.8"/>
    <rect x="34" y="144" width="70" height="6" rx="3" fill="#64748b"/>
    <rect x="34" y="156" width="100" height="6" rx="3" fill="#64748b" opacity="0.7"/>
    <rect x="18" y="178" width="70" height="10" rx="5" fill="url(#accent)"/>
    <rect x="96" y="178" width="82" height="10" rx="5" fill="#334155"/>
  </g>
  <!-- connector arrows -->
  <path d="M182 150 H228" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.9"/>
  <path d="M332 150 H372" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.9"/>
  <path d="M196 130 l14 20 l-14 20" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <path d="M356 130 l14 20 l-14 20" fill="none" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</svg>
